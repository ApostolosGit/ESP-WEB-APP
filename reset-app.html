<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Energy App Reset</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#07111c;color:#f4f8fb;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
    main{max-width:520px}
    p{color:#94a8bb}
  </style>
</head>
<body>
<main>
  <h1>Ενημέρωση εφαρμογής…</h1>
  <p>Καθαρίζεται η παλιά cache και φορτώνεται η τρέχουσα έκδοση.</p>
</main>
<script>
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const appScope = new URL("./", location.href).href;
      const regs = (await navigator.serviceWorker.getRegistrations())
        .filter((reg) => reg.scope === appScope);
      await Promise.all(regs.map((reg) => reg.unregister()));
    }
    if ("caches" in window) {
      const keys = (await caches.keys()).filter((key) => key.startsWith("energy-dds-jsy-pwa-"));
      await Promise.all(keys.map((key) => caches.delete(key)));
    }
  } catch (err) {
    console.warn("Reset cleanup warning", err);
  }
  try { sessionStorage.removeItem("energy.mqtt.tab-session"); } catch (_) {}
  location.replace("./?app=5.89&reset=" + Date.now());
})();
</script>
</body>
</html>
