name: Utility reading checks
on:
  pull_request:
    paths:
      - "history.js"
      - "app.js"
      - "style.css"
      - "sw.js"
      - "index.html"
      - "reset-app.html"
      - "tests/**"
      - ".github/workflows/utility-tests.yml"
  push:
    branches: [main]
    paths:
      - "history.js"
      - "app.js"
      - "style.css"
      - "sw.js"
      - "index.html"
      - "reset-app.html"
      - "tests/**"
      - ".github/workflows/utility-tests.yml"
permissions:
  contents: read
jobs:
  utility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_discovery_health.mjs
      - run: node tests/test_energy_history.mjs
      - run: node tests/test_energy_price.mjs
      - run: node --check history.js
      - run: node --check app.js
      - run: node --check sw.js
      - run: node tests/test_pwa_cache.mjs
      - run: node tests/test_utility_ek.mjs
      - name: Install browser test runtime
        run: |
          timeout 120s npm install --no-save --ignore-scripts playwright@1.62.1
          timeout 180s npx playwright install chromium
      - name: Check actual desktop, mobile and bar labels
        run: node tests/test_ui_browser.cjs
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-5-63
          path: tests/ui-artifacts/*.png
          retention-days: 3


